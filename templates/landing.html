<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Ballot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Rye&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#87CEEB">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/landing.css?v={{ version }}">
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="content">
        <h1 class="title">Welcome to Bubble Ballot!<br>Dive into an ocean of questions!</h1>
        <div class="boards">
            <a href="/general" class="board-link">/general</a>
            <a href="/testing" class="board-link">/testing</a>
            <a href="/whatsfordinner" class="board-link">/whatsfordinner</a>
        </div>
    </div>
    <form class="start" id="startForm" novalidate>
        <label for="boardName">Start or join a board</label>
        <div class="start-row">
            <input id="boardName" name="board" type="text" maxlength="60"
                   autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go"
                   placeholder="e.g. Friday town hall" aria-describedby="startHint">
            <button type="submit" id="startBtn">Dive in</button>
        </div>
        <p class="start-hint" id="startHint">No sign-up. Leave it blank and we'll pick a name for you.</p>
    </form>
    <script src="/static/landing.js?v={{ version }}"></script>
    <script src="/static/common.js?v={{ version }}"></script>
    <script src="/static/start.js?v={{ version }}"></script>
</body>
</html>
